# /etc/nginx/sites-available/stronghold.conf — 卫戍协议：盟约 反代 (docs/DEPLOY-LINUX.md)
#
# 用途：nginx 终止 TLS、把游戏转到本机的 node（默认 127.0.0.1:3000）、把 /admin 限定到运维 IP。
# 启用：
#   sudo cp deploy/nginx-stronghold.conf /etc/nginx/sites-available/stronghold.conf
#   sudo ln -s /etc/nginx/sites-available/stronghold.conf /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# 证书（HTTP-01 需要 80 端口可达）：
#   sudo certbot --nginx -d game.example.com
#
# 三个必须记住的点：
#   1. `/ws` 是 WebSocket：缺 Upgrade/Connection 头 + 过短的 read timeout，玩家会周期性掉线。
#   2. 素材有几百 MB：别让 nginx 缓冲它们，也别设 1 分钟就断的超时。
#   3. 服务端已经自己发 gzip 和 Cache-Control，nginx 再压一遍是浪费 CPU。

upstream stronghold_backend {
    server 127.0.0.1:3000;
    keepalive 32;
}

# ---- HTTP：只留下 ACME 挑战，其余全部跳 HTTPS ----
server {
    listen 80;
    listen [::]:80;
    server_name game.example.com;

    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name game.example.com;

    ssl_certificate     /etc/letsencrypt/live/game.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/game.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 后端已经压缩过，这里再压会白烧 CPU
    gzip off;

    # 后台的 POST 体很小（几十字节）；公告图片是 GET，不受这里限制
    client_max_body_size 1m;
    # 20 人同房时头部稍大（每个席位/观战一条），留点余量
    large_client_header_buffers 4 16k;

    # ---- 运维后台：只给运维 IP（按需改；不写 allow/deny 就是公开，靠 ADMIN_SECRET 保护）----
    # 注意：/admin 的页面靠 ADMIN_SECRET 登录，这里只是多一层网络层限制，可选。
    location /admin {
        allow 203.0.113.7;      # ← 换成你的运维出口 IP
        allow 10.0.0.0/8;       # 内网
        allow 127.0.0.1;
        deny all;
        proxy_pass http://stronghold_backend;
        include /etc/nginx/proxy_params_stronghold.conf;
    }
    location /api/admin/ {
        allow 203.0.113.7;
        allow 10.0.0.0/8;
        allow 127.0.0.1;
        deny all;
        proxy_pass http://stronghold_backend;
        include /etc/nginx/proxy_params_stronghold.conf;
    }

    # ---- WebSocket：整个游戏都靠它 ----
    location /ws {
        proxy_pass http://stronghold_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 长连接：一局可能几十分钟，掉线重连靠的是这个超时而不是重连逻辑
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- OneBot 反向 WS（docs/ADMIN.md §4.4）：NapCat 等连入本服时走这条，Token 在后台设置 ----
    location = /onebot/ws {
        proxy_pass http://stronghold_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # ---- 素材与数据：大文件、可长期缓存、不要缓冲 ----
    location /assets/ {
        proxy_pass http://stronghold_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }
    location /media/ {
        proxy_pass http://stronghold_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 900s;
    }

    # ---- 其余（页面、/data/、/shared/、/sim/、/packs/、/healthz、/api/announcements）----
    location / {
        proxy_pass http://stronghold_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
